# ledger-enum.conf · 账本第 2 列（类型）的唯一真源
#
# 谁读它：plugin-lint.sh（表式体检）/ journal-lint.sh（行式体检）/ journal-add.sh（写入闸门）
# 变更纪律：
#   1) 只增不删 —— 历史行不可改写，删值等于让存量数据变非法
#   2) 新增前先问「这是沉淀性质还是动作」——只有性质能进这一列
#   3) 改完必须跑 sh data/cmd/self-test.sh + sh bin/evo check（全量）
#
# 语义：
#   exp   = 经验（可复用的做法/结论）
#   rule  = 规则（升级为硬约束或流程约定）
#   fail  = 失败（踩过的坑，含归因）
#   state = 状态（快照、盘点、备份、链路变更等事实记录）
#   fix   = 修复（针对具体缺陷的修补，属经验子类但保留可检索性）
LEDGER_ENUM="exp rule fail state fix"