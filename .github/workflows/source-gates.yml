name: source-gates

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint（语法 + frontmatter）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装运行时
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mawk
          mawk -W version 2>&1 | head -1

      - name: sh -n 全量语法
        run: |
          set -eu
          chmod +x bin/evo data/cmd/*.sh 2>/dev/null || true
          fail=0
          git ls-files '*.sh' 'bin/evo' '.githooks/pre-commit' > /tmp/shells.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if ! sh -n "$f"; then
              echo "::error file=$f::shell 语法错误"
              fail=1
            fi
          done < /tmp/shells.txt
          echo "检查文件数：$(wc -l < /tmp/shells.txt)"
          exit $fail

      - name: py_compile
        run: |
          set -eu
          files=$(git ls-files 'data/cmd/*.py')
          if [ -z "$files" ]; then
            echo "无 .py 文件，跳过"
          else
            python3 -m py_compile $files
            echo "py_compile ok：$(echo "$files" | wc -l) 个"
          fi

      - name: SKILL.md frontmatter 完整性
        run: |
          set -eu
          test -f SKILL.md
          head -5 SKILL.md | grep -q '^name:'        || { echo "::error::SKILL.md 缺 name"; exit 1; }
          head -5 SKILL.md | grep -q '^description:' || { echo "::error::SKILL.md 缺 description"; exit 1; }
          # 口径与 data/cmd/check.sh C5 一致：按字符数（wc -m），不是字节数。
          # 中文 UTF-8 每字 3 字节；按字节卡会把合规的 190 字符描述算成 471 字节误杀。
          LEN=$(sed -n '3p' SKILL.md | wc -m)
          echo "description 字符数：$LEN（上限 400）"
          [ "$LEN" -le 400 ] || { echo "::error::description 超 400 字符上限"; exit 1; }

  snapshot:
    name: build-public + 开箱断言
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装运行时
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mawk

      - name: 构建公开快照
        run: |
          set -eu
          chmod +x bin/evo data/cmd/*.sh release/build-public.sh 2>/dev/null || true
          sh release/build-public.sh "$RUNNER_TEMP/EVO-public"
          test -f "$RUNNER_TEMP/EVO-public/bin/evo"
          echo "产物文件数：$(find "$RUNNER_TEMP/EVO-public" -type f | wc -l)"
          du -sh "$RUNNER_TEMP/EVO-public"

      - name: 零泄漏断言
        run: |
          set -eu
          cd "$RUNNER_TEMP/EVO-public"
          for p in data/store data/backup data/archive; do
            if [ -e "$p" ]; then
              echo "::error::产物含 $p（不应分发）"
              exit 1
            fi
          done
          JL=$(grep -c '^|' data/journal.md 2>/dev/null) || JL=0
          echo "journal.md 条目标记行：$JL（应为 0）"
          [ "$JL" -eq 0 ] || { echo "::error::journal.md 非空，禁止分发"; exit 1; }
          # 只查代码：文档/CHANGELOG 提及历史路径属正常（build-public §5.4 对此仅告警）
          if grep -rn '/sdcard/Download/Operit' --include='*.sh' --include='evo' --include='*.conf' . 2>/dev/null | grep -q .; then
            echo "::error::脚本残留本机绝对路径："
            grep -rn '/sdcard/Download/Operit' --include='*.sh' --include='evo' --include='*.conf' .
            exit 1
          fi
          echo "零泄漏检查通过（代码 0 命中 / 账本实体不存在 / journal 空模板）"

      # 拆成独立 step：失败时 jobs API 的 step 名即定位线索（日志需认证，step 粒度不需要）
      - name: 开箱 A · seed → sync → index（应 10 条）
        run: |
          set -eu
          cd "$RUNNER_TEMP/EVO-public"
          cp data/journal.seed.md data/journal.md
          sh bin/evo store sync
          sh bin/evo index build

      - name: 开箱 B · search-eval 断言（Top1=8/10）
        run: |
          set -eu
          cd "$RUNNER_TEMP/EVO-public"
          OUT=$(sh bin/evo search-eval example 2>&1 || true)
          echo "$OUT" | tail -4
          if ! echo "$OUT" | grep -q 'Top1=8/10'; then
            ACT=$(echo "$OUT" | grep -E '^N=' | tail -1)
            echo "::error::成绩漂移｜实际：${ACT:-<无 N= 行>}｜文档承诺：N=10 Top1=8/10 MRR=0.8500"
            exit 1
          fi

      - name: 开箱 C · self-test 断言（FAIL=0）
        run: |
          set -eu
          cd "$RUNNER_TEMP/EVO-public"
          ST=$(sh bin/evo self-test 2>&1 || true)
          echo "$ST" | tail -4
          if ! echo "$ST" | grep -q 'FAIL=0'; then
            echo "::error::self-test 存在 FAIL"
            exit 1
          fi
          echo "开箱断言全部通过"